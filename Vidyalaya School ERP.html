<div class="pg"><span>${rows.length} records${sel.size?` · ${sel.size} selected `+(A[0]?`<button class="ib" onclick="bulk()">${A[0][0]} selected</button>`:'')+` <button class="ib dg" onclick="bulkDel()">Delete selected</button>`:''}</span><span><button class="ib" ${T.pg?'':'disabled'} onclick="TS[key()].pg--;paint()">Prev</button> Page ${T.pg+1} of ${np} <button class="ib" ${T.pg<np-1?'':'disabled'} onclick="TS[key()].pg++;paint()">Next</button></span></div>`}
function table(){const k=key(),p=parse(spec());const T=TS[k]||(TS[k]={q:'',c:-1,d:1,pg:0});T.p=p;const st=p.cols.find(c=>c.k=='st');

const srt=j=>{const T=TS[key()];T.d=T.c==j?-T.d:1;T.c=j;paint()},selAll=c=>{const s=SEL[key()]=new Set();if(c)data().forEach(r=>s.add(r[0]));paint()},selOne=(i,c)=>{const s=SEL[key()];c?s.add(i):s.delete(i);paint()};
function act(id,v){const T=TS[key()],j=T.p.cols.findIndex(c=>c.k=='st');data().find(r=>r[0]==id)[j+1]=v;save();paint();toast(v+' ✓')}

function bulkDel(){const s=SEL[key()];confirmBox(`Delete ${s.size} selected records?`,()=>{DB[key()]=data().filter(r=>!s.has(r[0]));s.clear();save();paint();toast('Records deleted')})}
function del(id){confirmBox('Delete this record? This cannot be undone.',()=>{DB[key()]=data().filter(r=>r[0]!=id);save();paint();toast('Record deleted')})}

function addRow(id){const cols=parse(spec()).cols,row=id&&data().find(r=>r[0]==id);

return`<label>${c.l} <span class="req">*</span>${sel?`<select name=${nm}>${sel.map(o=>`<option ${o==v?'selected':''}>${o}</option>`).join('')}</select>`:`<input name=${nm} type="${c.k=='dt'?'date':c.k=='amt'||c.k=='num'?'number':c.k=='ph'?'tel':'text'}" value="${c.k=='ph'?String(v).replace('+91 ',''):c.k=='dt'?'':v}" ${c.k=='ph'?'placeholder="10-digit mobile" maxlength=10':''}>`}<span class="er"></span></label>`}).join('');
modal(`<h2>${id?'Edit':'Add'} ${cur()?cur()[1].toLowerCase():'record'} entry</h2><form id="fm" onsubmit="return false"><div class="fg">${f}</div><div class="ft"><button type=button onclick="closeM()">Cancel</button><button class="pr" type=button onclick="saveRow(${id||0})">Save</button></div></form>`)}
function saveRow(id){const cols=parse(spec()).cols;let ok=1,vals=[];cols.forEach((c,j)=>{const el=document.forms.fm['f'+j],v=el.value.trim();let e='';if(!v&&!(id&&c.k=='dt'))e='This field is required';else if(c.k=='ph'&&!/^[6-9]\d{9}$/.test(v))e='Enter a valid 10-digit Indian mobile number';el.parentNode.querySelector('.er').textContent=e;if(e)ok=0;
vals.push(c.k=='ph'?'+91 '+v:c.k=='dt'&&v?(d=>`${d[2]} ${MO[+d[1]-1]} ${d[0]}`)(v.split('-')):c.k=='dt'?data().find(r=>r[0]==id)[j+1]:['amt','num'].includes(c.k)?+v:v)});if(!ok)return;
const d=data();if(id)d.find(r=>r[0]==id).splice(1,cols.length,...vals);else d.unshift([Math.max(0,...d.map(r=>r[0]))+1,...vals]);save();closeM();paint();toast(id?'Changes saved':'Record added')}
function profile(id){const r=data().find(x=>x[0]==id),T=['Overview','Personal','Guardians','Academic','Attendance','Fees','Exams','Documents','History'];
const body=t=>({Overview:`<b>${r[1]}</b> · ${r[2]} · Attendance ${r[5]}% · Fees ${r[6]}`,Personal:`Admission no. ADM-${2200+id}<br>DOB 14 Aug 2013 · Blood group B+`,Guardians:`${r[3]} (Parent)<br>${r[4]}`,Academic:'Mathematics 86 · Science 91 · English 78 · Hindi 82',Attendance:`Present ${r[5]}% this year`,Fees:`Current status: ${r[6]}`,Exams:'Unit Test 2: 84.5% · Grade A2',Documents:'Birth certificate ✓ · Transfer certificate ✓ · Aadhaar (pending)',History:'12 Oct: Fee paid · 03 Sep: Promoted · 01 Apr: Admitted'})[t];
window.pt=t=>{$('#pb').innerHTML=body(t);document.querySelectorAll('#pt div').forEach(d=>d.classList.toggle('on',d.textContent==t))};modal(`<h2>Student profile</h2><div class="tabs" id="pt">${T.map(t=>`<div onclick="pt('${t}')">${t}</div>`).join('')}</div><div id="pb" style="min-height:70px"></div><div class="ft"><button onclick="toast('ID card ready to print')">Print ID card</button><button onclick="closeM()">Close</button></div>`);pt('Overview')}
