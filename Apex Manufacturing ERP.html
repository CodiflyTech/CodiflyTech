const bars=(a,b)=>{const m=60;let s='<svg viewBox="0 0 420 170" width="100%">';a.forEach((v,i)=>{const x=20+i*58;s+=`<rect x="${x}" y="${150-v*2.2}" width="18" height="${v*2.2}" rx="2" fill="var(--ac)"/><rect x="${x+20}" y="${150-b[i]*2.2}" width="18" height="${b[i]*2.2}" rx="2" fill="var(--bd)"/><text x="${x+8}" y="166">${LBL[i]}</text>`});return s+'</svg>'};
const line=(a,w=420,h=170,l=1)=>{const mx=Math.max(...a),mn=Math.min(...a);const pts=a.map((v,i)=>`${10+i*(w-20)/(a.length-1)},${h-14-(v-mn)/(mx-mn||1)*(h-34)}`).join(' ');return `<svg viewBox="0 0 ${w} ${h}" width="100%" ${l?'':'height="34"'}><polyline points="${pts}" fill="none" stroke="var(--ac)" stroke-width="2"/>${l?a.map((v,i)=>`<text x="${10+i*(w-20)/(a.length-1)-8}" y="${h-1}">${LBL[i]}</text>`).join(''):''}</svg>`};
const donut=(d,c)=>{const t=d.reduce((a,b)=>a+b,0);let o=0,s='<svg viewBox="0 0 120 120" width="120">';d.forEach((v,i)=>{const p=v/t*100;s+=`<circle cx="60" cy="60" r="40" fill="none" stroke="${c[i]}" stroke-width="18" pathLength="100" stroke-dasharray="${p-.6} ${100-p+.6}" stroke-dashoffset="${-o}" transform="rotate(-90 60 60)"/>`;o+=p});return s+'</svg>'};
const bdg=(s,c)=>`<span class="bdg ${String(s).split(' ')[0]}${c?' s':''}" ${c?'title="Click to change status"':''}>${esc(s)}</span>`;
const hbar=(v,l)=>`<div class="li"><span style="width:90px">${l}</span><div class="bar" style="flex:1;align-self:center"><i style="width:${v}%"></i></div><b>${v}%</b></div>`;
function toast(m){const t=document.createElement('div');t.className='toast';t.textContent=m;document.body.append(t);setTimeout(()=>t.remove(),2200)}
function modal(h){const m=document.createElement('div');m.className='mo';m.innerHTML='<div class="mb">'+h+'</div>';m.onclick=e=>{if(e.target===m)m.remove()};document.body.append(m);return m}
function dash(){const m=MULT[$('#dt').value]||1;
const k=KP.map((x,i)=>{const v=i<4&&i!==4?x[1]*m:i===5||i===6?x[1]*(i===5?Math.max(m,.5):1):x[1];const s=i===3?Math.round(v).toLocaleString('en-IN'):i===0||i===1||i===2||i===6?'₹'+v.toFixed(1)+' L':x[1]+(x[3]==='%'?'%':'');
const c=x[4]>=0;return `<div class="card"><div class="kl">${x[0]}</div><div class="kv">${i===5?Math.round(x[1]*Math.max(m,.5)):s}</div><div class="${(i===5?!c:c)?'up':'dn'}">${c?'▲':'▼'} ${Math.abs(x[4])}% <span class="kl">vs prev. period</span></div>${line(REV.map((v,j)=>v+Math.sin(j+i)*4),120,34,0)}</div>`}).join('');
const li=(a)=>a.map(r=>`<div class="li"><span>${r[0]}</span>${r[1]}</div>`).join('');
return `<div class="pg"><h1 class="h1">Good morning, Rohan</h1><p class="sub">Operations summary for ${esc($('#br').value)} · ${esc($('#dt').value)}</p>
<div class="grid k4">${k}</div><div class="grid g2" style="margin-top:14px"><div class="card"><h3>Revenue vs expenses (₹ lakh)</h3>${bars(REV,EXP)}</div><div class="card"><h3>Production output trend (000 units)</h3>${line(OUT)}</div></div>
<div class="grid g3" style="margin-top:14px"><div class="card"><h3>Inventory distribution</h3><div style="display:flex;gap:14px;align-items:center" class="donut-box">${donut([48,22,18,12],['var(--ac)','#16a34a','#d97706','#9aa3b2'])}<div class="kl">● Raw 48%<br>● WIP 22%<br>● Finished 18%<br>● Spares 12%</div></div></div>
<div class="card"><h3>Department output</h3>${hbar(92,'Production')+hbar(78,'Assembly')+hbar(64,'Finishing')}</div><div class="card"><h3>Machine utilisation</h3>${hbar(88,'CNC-01')+hbar(91,'WLD-04')+hbar(0,'HP-03')}</div></div>
<div class="grid g2" style="margin-top:14px"><div class="card"><h3>Recent production orders</h3><div class="tw"><table><tbody>${P(M.production.tabs['Production orders'][1]).slice(0,5).map(r=>`<tr data-g="production"><td>${r[0]}</td><td>${r[1]}</td><td><div class="bar"><i style="width:${r[4]}%"></i></div></td><td>${bdg(r[5])}</td></tr>`).join('')}</tbody></table></div></div>
<div class="card"><h3>Alerts</h3>${li([['HP-03 press breakdown',bdg('Breakdown')],['Aluminium Ingot below minimum',bdg('Low')],['Hydraulic Oil below minimum',bdg('Low')],['PUR-2202 awaiting approval',bdg('Pending')],['Anil Patil leave, 18–19 Nov',bdg('Pending')]])}</div></div></div>`}
function rows(id,tab){const k='apex:'+id+':'+tab;return ST(k)||P(M[id].tabs[tab][1])}
function table(id){const s=st[id]||(st[id]={tab:Object.keys(M[id].tabs)[0],q:'',sc:-1,d:1,p:0,f:''});const tab=s.tab,cols=M[id].tabs[tab][0].split('|');
const c=$('#c');c.innerHTML=`<div class="pg"><h1 class="h1">${title(id)}</h1><p class="sub">Manage records, update statuses and create new entries. Changes save in this browser.</p>
<div class="tabs">${Object.keys(M[id].tabs).map(t=>`<div class="tab ${t===tab?'on':''}" data-t="${esc(t)}">${t}</div>`).join('')}</div><div class="grid k4" id="ks" style="margin-bottom:14px"></div>
<div class="card"><div class="tb"><input id="q" placeholder="Search ${esc(tab.toLowerCase())}…" value="${esc(s.q)}"><select id="fl"></select><div class="sp"></div><button class="btn" id="ex">Export CSV / PDF</button><button class="btn p" id="nw">＋ New record</button></div><div class="tw" id="tbl"></div><div class="pgr" id="pgr"></div></div></div>`;
c.querySelectorAll('.tab').forEach(t=>t.onclick=()=>{s.tab=t.dataset.t;s.p=0;s.f='';s.q='';table(id)});
$('#q').oninput=e=>{s.q=e.target.value;s.p=0;draw(id)};$('#fl').onchange=e=>{s.f=e.target.value;s.p=0;draw(id)};
$('#ex').onclick=()=>toast('Export started – report.xlsx ready (simulated)');$('#nw').onclick=()=>form(id);draw(id)}
function draw(id){const s=st[id],tab=s.tab,cols=M[id].tabs[tab][0].split('|'),all=rows(id,tab),si=cols.indexOf('Status');
const sts=[...new Set(all.map(r=>r[si]))];const fl=$('#fl');fl.innerHTML='<option value="">All statuses</option>'+sts.map(x=>`<option ${x===s.f?'selected':''}>${x}</option>`).join('');
$('#ks').innerHTML=`<div class="card"><div class="kl">Total records</div><div class="kv">${all.length}</div></div>`+sts.slice(0,3).map(x=>`<div class="card"><div class="kl">${x}</div><div class="kv">${all.filter(r=>r[si]===x).length}</div></div>`).join('');
let r=all.map((x,i)=>[x,i]).filter(([x])=>(!s.f||x[si]===s.f)&&x.join(' ').toLowerCase().includes(s.q.toLowerCase()));
if(s.sc>=0)r.sort((a,b)=>String(a[0][s.sc]).localeCompare(String(b[0][s.sc]),undefined,{numeric:true})*s.d);
const n=6,pc=Math.max(1,Math.ceil(r.length/n));s.p=Math.min(s.p,pc-1);const pg=r.slice(s.p*n,s.p*n+n);
$('#tbl').innerHTML=r.length?`<table><thead><tr>${cols.map((h,i)=>`<th data-i="${i}">${h}${s.sc===i?(s.d>0?' ↑':' ↓'):''}</th>`).join('')}</tr></thead><tbody>${pg.map(([x,i])=>`<tr data-i="${i}">${x.map((v,j)=>`<td>${cols[j]==='Status'?`<span data-s="${i}">${bdg(v,1)}</span>`:/^Progress|^Utilisation/.test(cols[j])?`<div style="display:flex;gap:6px;align-items:center"><div class="bar" style="flex:1"><i style="width:${v}%"></i></div>${v}%</div>`:esc(v)}</td>`).join('')}</tr>`).join('')}</tbody></table>`:'<div class="empty"><b>No records match</b><br>Clear the search or filter, or add a new record.</div>';
$('#pgr').innerHTML=`<span>${r.length} records · page ${s.p+1} of ${pc}</span><button class="btn" id="pv" ${s.p?'':'disabled'}>Prev</button><button class="btn" id="nx" ${s.p<pc-1?'':'disabled'}>Next</button>`;
$('#pv').onclick=()=>{s.p--;draw(id)};$('#nx').onclick=()=>{s.p++;draw(id)};
document.querySelectorAll('#tbl th').forEach(h=>h.onclick=()=>{const i=+h.dataset.i;s.d=s.sc===i?-s.d:1;s.sc=i;draw(id)});
document.querySelectorAll('#tbl tbody tr').forEach(tr=>tr.onclick=e=>{const i=+tr.dataset.i;if(e.target.closest('[data-s]')){const set=sts.length>1?sts:['Pending','In Progress','Completed'],a=rows(id,tab);a[i][si]=set[(set.indexOf(a[i][si])+1)%set.length];ST('apex:'+id+':'+tab,a);draw(id);toast('Status updated to '+a[i][si]);return}
modal(`<h2>${esc(rows(id,tab)[i][0])}</h2>`+cols.map((h,j)=>`<div class="li"><span class="kl">${h}</span><b>${esc(rows(id,tab)[i][j])}</b></div>`).join('')+'<div style="text-align:right;margin-top:12px"><button class="btn" onclick="this.closest(\'.mo\').remove()">Close</button></div>')})}
function form(id){const s=st[id],tab=s.tab,cols=M[id].tabs[tab][0].split('|'),si=cols.indexOf('Status'),all=rows(id,tab),sts=[...new Set(all.map(r=>r[si]))];
const m=modal(`<h2>New record</h2><div id="ff">${cols.map((h,j)=>`<div class="f"><label>${h}</label>${h==='Status'?`<select>${sts.map(x=>`<option>${x}</option>`).join('')}</select>`:`<input ${/^Progress|^Utilisation/.test(h)?'type="number" min="0" max="100"':''}><div class="er"></div>`}</div>`).join('')}</div><div style="text-align:right"><button class="btn" id="cx">Cancel</button> <button class="btn p" id="sv">Save record</button></div>`);
m.querySelector('#cx').onclick=()=>m.remove();m.querySelector('#sv').onclick=()=>{let ok=1;const v=[...m.querySelectorAll('#ff .f')].map((f,j)=>{const i=f.querySelector('input,select'),e=f.querySelector('.er'),x=i.value.trim();if(e)e.textContent='';if(i.tagName==='INPUT'){if(!x){e.textContent='This field is required';ok=0}else if(i.type==='number'&&(x<0||x>100)){e.textContent='Enter a value from 0 to 100';ok=0}}return x});
if(!ok)return;ST('apex:'+id+':'+tab,[v,...all]);m.remove();draw(id);toast('Record created')}}
const PM=['Production','Inventory','Purchase','Payroll','Quality','Sales','Finance','Machines'],RL=['Super Admin','Company Owner','General Manager','HR Manager','Production Manager','Inventory Manager','Purchase Manager','Accountant','Quality Manager','Supervisor','Employee'],AC=['View','Create','Edit','Delete','Approve'];
function roles(){const p=ST('apex:perm')||{},r=st.role||0;const key=(m,a)=>RL[r]+m+a,on=(m,a)=>key(m,a) in p?p[key(m,a)]:(r<3||(a==='View'&&r<10)||(r===4&&m==='Production')||(r===7&&m==='Finance'));
$('#c').innerHTML=`<div class="pg"><h1 class="h1">User roles & permissions</h1><p class="sub">Choose a role, then control what it can do in each module.</p><div class="tb"><select id="rl">${RL.map((x,i)=>`<option value="${i}" ${i===r?'selected':''}>${x}</option>`).join('')}</select><div class="sp"></div><button class="btn" id="ar">＋ Create custom role</button></div>
<div class="card tw"><table><thead><tr><th>Module</th>${AC.map(a=>`<th>${a}</th>`).join('')}</tr></thead><tbody>${PM.map(m=>`<tr style="cursor:default"><td>${m}</td>${AC.map(a=>`<td><input type="checkbox" data-k="${key(m,a)}" ${on(m,a)?'checked':''}></td>`).join('')}</tr>`).join('')}</tbody></table></div></div>`;
$('#rl').onchange=e=>{st.role=+e.target.value;roles()};document.querySelectorAll('[data-k]').forEach(c=>c.onchange=()=>{p[c.dataset.k]=c.checked;ST('apex:perm',p);toast('Permission saved')});
$('#ar').onclick=()=>{const m=modal('<h2>Create custom role</h2><div class="f"><label>Role name</label><input id="rn"><div class="er"></div></div><div style="text-align:right"><button class="btn p" id="rk">Create role</button></div>');m.querySelector('#rk').onclick=()=>{const v=m.querySelector('#rn').value.trim();if(!v){m.querySelector('.er').textContent='Enter a role name';return}RL.push(v);st.role=RL.length-1;m.remove();roles();toast('Role created')}}}
function reports(){const R=['Production','Inventory','Employee','Attendance','Payroll','Purchase','Sales','Quality','Machine performance','Financial','Production cost analysis'];
$('#c').innerHTML=`<div class="pg"><h1 class="h1">Analytics & reports</h1><p class="sub">Generate and export reports for any period.</p><div class="tb"><input type="date" value="2026-11-01"><input type="date" value="2026-11-12"><input id="rq" placeholder="Search reports…"></div><div class="grid g3" id="rg"></div></div>`;
const d=()=>{$('#rg').innerHTML=R.filter(x=>x.toLowerCase().includes($('#rq').value.toLowerCase())).map((x,i)=>`<div class="card"><h3>${x} report</h3>${line(REV.map((v,j)=>v+Math.cos(i+j)*5),200,50,0)}<div class="tb" style="margin:8px 0 0"><button class="btn" data-x="PDF ${x}">PDF</button><button class="btn" data-x="Excel ${x}">Excel</button></div></div>`).join('')||'<div class="empty">No reports match.</div>';document.querySelectorAll('[data-x]').forEach(b=>b.onclick=()=>toast(b.dataset.x+' export ready (simulated)'))};$('#rq').oninput=d;d()}
function settings(){const v=ST('apex:set')||{name:'Apex Manufacturing Industries',gst:'27AAACA1234F1Z5',cur:'INR (₹)',days:'Mon–Sat',shift:'3 shifts'};
$('#c').innerHTML=`<div class="pg"><h1 class="h1">Company settings</h1><p class="sub">Company profile, tax, shifts and working days.</p><div class="card" style="max-width:560px">${Object.keys(v).map(k=>`<div class="f"><label>${{name:'Company name',gst:'GSTIN',cur:'Currency',days:'Working days',shift:'Shift pattern'}[k]}</label><input data-s="${k}" value="${esc(v[k])}"></div>`).join('')}<button class="btn p" id="ss">Save settings</button></div></div>`;
$('#ss').onclick=()=>{const o={};document.querySelectorAll('[data-s]').forEach(i=>o[i.dataset.s]=i.value);if(!o.name.trim()){toast('Company name is required');return}ST('apex:set',o);toast('Settings saved')}}
const title=id=>NAV.flatMap(g=>g[1]).find(x=>x[0]===id)[1];
function go(id){if(!NAV.flatMap(g=>g[1]).some(x=>x[0]===id))id='dashboard';cur=id;history.replaceState(0,'','#'+id);$('#tt').textContent=title(id);$('#bc').textContent='Apex Manufacturing › '+title(id);
document.querySelectorAll('.nv').forEach(n=>n.classList.toggle('on',n.dataset.id===id));$('#app').classList.remove('mob');
if(id==='dashboard')$('#c').innerHTML=dash();else if(id==='reports')reports();else if(id==='roles')roles();else if(id==='settings')settings();else table(id);$('#c').scrollTop=0}
H($('#nav'),NAV.map(g=>`<div class="grp">${g[0]}</div>`+g[1].map(n=>`<button class="nv" data-id="${n[0]}" data-t="${n[1]}"><i>${n[2]}</i><span>${n[1]}</span></button>`).join('')).join(''));
document.querySelectorAll('.nv').forEach(n=>n.onclick=()=>go(n.dataset.id));
document.addEventListener('click',e=>{const g=e.target.closest('[data-g]');if(g){go(g.dataset.g)}if(!e.target.closest('.rel'))document.querySelectorAll('.dd').forEach(d=>d.classList.remove('show'))});
[['nb','nd'],['qb','qd'],['pb','pd']].forEach(([b,d])=>$('#'+b).onclick=e=>{e.stopPropagation();const o=$('#'+d).classList.contains('show');document.querySelectorAll('.dd').forEach(x=>x.classList.remove('show'));if(!o)$('#'+d).classList.add('show')});
H($('#nd'),'<div data-g="machines"><b>HP-03 breakdown</b><small>Hydraulic press · 09:12</small></div><div data-g="inventory"><b>Aluminium Ingot low</b><small>2,100 kg left · 08:40</small></div><div data-g="purchase"><b>PUR-2202 needs approval</b><small>₹8,45,000 · Yesterday</small></div><div data-g="notifications">View all notifications</div>');
H($('#qd'),[['production','New production order'],['purchase','New purchase request'],['employees','Add employee'],['sales','New sales order'],['tasks','Create task']].map(a=>`<div data-q="${a[0]}">${a[1]}</div>`).join(''));
document.querySelectorAll('[data-q]').forEach(q=>q.onclick=()=>{go(q.dataset.q);setTimeout(()=>$('#nw').click(),0)});
$('#rs').onclick=()=>{Object.keys(localStorage).filter(k=>k.startsWith('apex:')).forEach(k=>localStorage.removeItem(k));st={};go(cur);toast('Demo data reset')};
$('#cb').onclick=()=>$('#app').classList.toggle('col');$('#mb').onclick=e=>{e.stopPropagation();$('#app').classList.toggle('mob')};
$('#app').addEventListener('click',e=>{if($('#app').classList.contains('mob')&&!e.target.closest('aside')&&!e.target.closest('#mb'))$('#app').classList.remove('mob')});
$('#dt').onchange=()=>{if(cur==='dashboard')go('dashboard')};$('#br').onchange=$('#dt').onchange;
const gs=$('#gs');gs.classList.remove('hide');gs.onkeydown=e=>{if(e.key==='Enter'){const q=gs.value.toLowerCase(),f=NAV.flatMap(g=>g[1]).find(x=>x[1].toLowerCase().includes(q));if(f){go(f[0]);gs.value=''}else toast('No module matches “'+gs.value+'”')}};
const setTh=t=>{document.documentElement.dataset.theme=t;$('#tm').textContent=t==='light'?'☾':'☀';$('#tm').title=t==='light'?'Switch to dark mode':'Switch to light mode'};setTh(ST('apex:theme')||'light');$('#tm').onclick=()=>{const t=document.documentElement.dataset.theme==='light'?'dark':'light';ST('apex:theme',t);setTh(t)};
$('#br').classList.remove('hide');go(location.hash.slice(1)||'dashboard');
</script></body></html>
